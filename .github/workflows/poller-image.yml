# Builds the poller image and pushes it to GitHub's container registry
# (ghcr.io/calli-ope/tarcycle-poller), where the cluster pulls it from.
# Runs when poller code changes on main or poller, or by hand (Actions tab).
name: poller image

on:
  push:
    branches: [main, poller]
    paths: ["poller/**", ".github/workflows/poller-image.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io with the built-in GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: pip install pytest && pytest tests/test_poller.py

      # QEMU + Buildx: build for x86 and ARM (e.g. Raspberry Pi) in one image.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: "latest" and the commit SHA. The digest (for pinning in
      # poller/k8s/cronjob.yaml) is printed at the end of this step.
      - uses: docker/build-push-action@v6
        id: push
        with:
          context: poller
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/calli-ope/tarcycle-poller:latest
            ghcr.io/calli-ope/tarcycle-poller:${{ github.sha }}

      - name: Show digest
        run: echo "ghcr.io/calli-ope/tarcycle-poller:${{ github.sha }}@${{ steps.push.outputs.digest }}"
