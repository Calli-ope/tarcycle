# Optional routing engines to compare with NetworkX: `docker compose up -d`
# (see README). The app expects Valhalla on port 8002 and BRouter on 17777.
services:
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    container_name: tarcycle-valhalla
    ports:
      - "8002:8002"
    volumes:
      - ./valhalla-data:/custom_files
    environment:
      # Downloaded only when valhalla-data/ contains no .pbf yet.
      tile_urls: https://download.geofabrik.de/europe/estonia-latest.osm.pbf
      # Reuse the built tiles on every start. To rebuild after replacing the
      # .pbf, delete valhalla-data/valhalla_tiles.tar and valhalla_tiles/.
      use_tiles_ignore_pbf: "True"
      force_rebuild: "False"
      # "True" makes use_hills work; costs one full rebuild plus an elevation download.
      build_elevation: "False"
      build_admins: "True"
      build_time_zones: "True"
      server_threads: "4"

  brouter:
    # No release image reads the current (v11) segments yet; nightly pinned by digest.
    image: ghcr.io/abrensch/brouter@sha256:f1259dbd074ce92084f038cff6bdf33ae73b8a0b2009115c19ead045200de692
    container_name: tarcycle-brouter
    ports:
      - "17777:17777"
    volumes:
      # E25_N55.rd5 covers Estonia: https://brouter.de/brouter/segments4/
      - ./brouter-data/segments4:/segments4
    environment:
      MAXTHREADS: "4"
      JAVA_OPTS: "-Xmx512M -Xms128M -Xmn8M -DmaxRunningTime=300 -DuseRFCMimeType=false"
