<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tarcycle</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="map-shell">
      <div id="map" aria-label="Tartu bicycle map"></div>
      <section class="controls" aria-label="Route planner">
        <h1>Tarcycle</h1>
        <p class="subtitle">Plan a bicycle route across Tartu.</p>
        <div class="mode-switch" role="group" aria-label="Route input mode">
          <button id="stations-mode" class="mode active" type="button">Stations</button>
          <button id="addresses-mode" class="mode" type="button">Addresses</button>
        </div>
        <div id="station-inputs">
          <label for="from">Start station</label>
          <select id="from"></select>
          <label for="to">Destination station</label>
          <select id="to"></select>
        </div>
        <div id="address-inputs" hidden>
          <label for="from-address">Start address</label>
          <input id="from-address" placeholder="e.g. Raekoja plats 1" />
          <label for="to-address">Destination address</label>
          <input id="to-address" placeholder="e.g. Ülikooli 18" />
        </div>
        <label>Router</label>
        <div class="mode-switch" role="group" aria-label="Routing backend">
          <button class="mode backend active" data-backend="networkx" type="button">NetworkX</button>
          <button class="mode backend" data-backend="valhalla" type="button">Valhalla</button>
        </div>
        <button id="route">Plan route</button>
        <p id="status" role="status"></p>
        <a class="page-link" href="./coverage.html">GPS traces vs OSM map →</a>
      </section>
    </main>
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
